<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- SK Arabians ornaments (version 3): drawn in-house. Every symbol is 1px gold line work on transparent, scaled by CSS;
     stroke="currentColor" so the colour comes from the page. The arch clip path (objectBoundingBox) frames photographs. -->
<!-- the eight-pointed star (the brand's rub el hizb): two squares turned 45°, a small circle at the centre -->
<symbol id="rosette" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="1"><rect x="12" y="12" width="24" height="24"/><rect x="12" y="12" width="24" height="24" transform="rotate(45 24 24)"/><circle cx="24" cy="24" r="3.2"/><circle cx="24" cy="24" r="1" fill="currentColor" stroke="none"/></g></symbol>
<!-- a filled star for small accents (medal rails, list markers) -->
<symbol id="star8" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5 14.6 7l5.6-1.9L18.3 11l5.2 2.6-5.2 2.4 1.9 5.9-5.6-1.9L12 25.5 9.4 20 3.8 21.9 5.7 16 .5 13.6 5.7 11 3.8 5.1 9.4 7z"/></symbol>
<!-- an ornamental divider: hairline, a small star, hairline -->
<symbol id="divider" viewBox="0 0 320 24" preserveAspectRatio="none"><g fill="none" stroke="currentColor" stroke-width="1"><path d="M0 12H132M188 12H320"/><rect x="150" y="2" width="20" height="20"/><rect x="150" y="2" width="20" height="20" transform="rotate(45 160 12)"/><circle cx="160" cy="12" r="2.6"/></g></symbol>
<!-- a filigree corner for framed photographs: a double bracket and a split-palmette scroll (the other three corners are mirrored by CSS) -->
<symbol id="corner" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><path pathLength="1" d="M2 62V22C2 11 11 2 22 2h40"/><path pathLength="1" opacity=".55" d="M8 62V26c0-10 8-18 18-18h36"/><path pathLength="1" d="M14 42c0-11 8-18 19-18M9 46c-4-11 2-21 11-25M30 12c-6 2-10 6-12 12"/><circle cx="20" cy="20" r="1.8" fill="currentColor"/></g></symbol>
<!-- the khatam: the eight-pointed star with its inner octagon and eight rays (watermarks, markers, the no-photo tile) -->
<symbol id="khatam" viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"><g class="outer"><rect x="20" y="20" width="60" height="60"/><rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)"/></g><g class="inner"><path d="M50 26l17 7 7 17-7 17-17 7-17-7-7-17 7-17z"/><circle cx="50" cy="50" r="12"/><path d="M50 14v6M50 80v6M14 50h6M80 50h6M24.5 24.5l4.3 4.3M71.2 71.2l4.3 4.3M24.5 75.5l4.3-4.3M71.2 28.8l4.3-4.3"/></g><circle cx="50" cy="50" r="1.6" fill="currentColor" stroke="none"/></g></symbol>
<!-- a hairline that ends in a palmette finial (under a chapter's lead) -->
<symbol id="finial" viewBox="0 0 320 16" preserveAspectRatio="xMinYMid meet"><g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><path d="M0 8H286" pathLength="1"/><path d="M286 8c8-7 18-7 26 0c-8 7-18 7-26 0z"/><circle cx="316" cy="8" r="1.6" fill="currentColor" stroke="none"/></g></symbol>
<!-- a championship medal on its ribbon (the medal face is painted by CSS classes medal-gold/silver/bronze through currentColor) -->
<symbol id="medal" viewBox="0 0 64 88"><path fill="currentColor" opacity=".28" d="M20 0h24l-6 30H26z"/><path fill="currentColor" opacity=".16" d="M14 0h12l6 30-8 6z"/><path fill="currentColor" opacity=".16" d="M38 0h12l-10 36-8-6z"/><circle cx="32" cy="58" r="27" fill="currentColor" opacity=".22"/><circle cx="32" cy="58" r="27" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="32" cy="58" r="21" fill="none" stroke="currentColor" stroke-width="1" opacity=".7"/><path fill="currentColor" d="M32 42.5 35 51l9-3-6 7.5 6 7.5-9-3-3 8.5-3-8.5-9 3 6-7.5-6-7.5 9 3z"/></symbol>
<!-- a laurel pair for the honour roll -->
<symbol id="laurel" viewBox="0 0 80 40"><g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><path d="M34 38C18 36 6 26 4 8c10 2 18 8 22 18M30 34c-6-1-12-6-14-14 6 1 10 5 12 10M28 26c-4-1-8-4-9-9 4 1 7 3 8 7"/><path d="M46 38c16-2 28-12 30-30-10 2-18 8-22 18M50 34c6-1 12-6 14-14-6 1-10 5-12 10M52 26c4-1 8-4 9-9-4 1-7 3-8 7"/></g></symbol>
<!-- the pointed arch, as a clip for photographs: 0–1 coordinates (clipPathUnits="objectBoundingBox") -->
<clipPath id="arch-clip" clipPathUnits="objectBoundingBox"><path d="M0 1V0.26C0 0.12 0.18 0.03 0.5 0C0.82 0.03 1 0.12 1 0.26V1Z"/></clipPath>
<!-- a softer round arch -->
<clipPath id="arch-round" clipPathUnits="objectBoundingBox"><path d="M0 1V0.3C0 0.1 0.22 0 0.5 0C0.78 0 1 0.1 1 0.3V1Z"/></clipPath>
<!-- the shallow arch of the horse cards (the arcade) -->
<clipPath id="arch-cards" clipPathUnits="objectBoundingBox"><path d="M0 1V0.22C0 0.09 0.2 0.02 0.5 0C0.8 0.02 1 0.09 1 0.22V1Z"/></clipPath>
</svg>
